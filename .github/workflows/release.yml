name: Release

on:
  push:
    tags: ["v*"]
  # Manual retry/backfill: dispatch with a tag as the ref (e.g. `gh workflow run
  # release.yml --ref v0.1.0`); the existing release is updated in place.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(command -v sdkmanager || ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "drydock-${{ github.ref_name }}-debug.apk"

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              "drydock-${{ github.ref_name }}-debug.apk#Drydock ${{ github.ref_name }} debug APK (experimental)" \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }} (experimental)" \
              --prerelease \
              --notes "Experimental pre-release. The attached APK is a **debug build**, signed with the standard Android debug key — sideload it at your own risk. It has not yet been validated on physical hardware; see the README's Known limitations.

          Release builds are not signed yet; build locally with \`./gradlew assembleRelease\` if you want an optimized (unsigned) APK." \
              "drydock-${{ github.ref_name }}-debug.apk#Drydock ${{ github.ref_name }} debug APK (experimental)"
          fi
