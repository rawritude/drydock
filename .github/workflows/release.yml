name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "drydock-${{ github.ref_name }}-debug.apk"

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              "drydock-${{ github.ref_name }}-debug.apk#Drydock ${{ github.ref_name }} debug APK (experimental)" \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }} (experimental)" \
              --prerelease \
              --notes "Experimental pre-release. The attached APK is a **debug build**, signed with the standard Android debug key — sideload it at your own risk. It has not yet been validated on physical hardware; see the README's Known limitations.

          Release builds are not signed yet; build locally with \`./gradlew assembleRelease\` if you want an optimized (unsigned) APK." \
              "drydock-${{ github.ref_name }}-debug.apk#Drydock ${{ github.ref_name }} debug APK (experimental)"
          fi
